name: ELS Report

on:
  schedule:
    # 22:00 UTC = 07:00 KST next day. UTC Sun-Thu = KST Mon-Fri.
    - cron: "47 21 * * 0,1,2,3,4"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Run backfill first (only needed once)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: els-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Ubuntu runners have no Korean font.
      # Without this the chart axes render as tofu boxes.
      - name: Install Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          sudo fc-cache -fv > /dev/null

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Backfill history (manual, once)
        if: inputs.backfill
        run: python backfill.py

      - name: Run report
        env:
          ELS_SMTP_HOST:      ${{ secrets.ELS_SMTP_HOST }}
          ELS_SMTP_PORT:      ${{ secrets.ELS_SMTP_PORT }}
          ELS_SMTP_USER:      ${{ secrets.ELS_SMTP_USER }}
          ELS_SMTP_PASSWORD:  ${{ secrets.ELS_SMTP_PASSWORD }}
          ELS_MAIL_FROM:      ${{ secrets.ELS_MAIL_FROM }}
          ELS_MAIL_TO:        ${{ secrets.ELS_MAIL_TO }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          ELS_DASHBOARD_URL:  ${{ vars.ELS_DASHBOARD_URL }}
        run: python main.py

      - name: Commit history & dashboard
        run: |
          git config user.name  "els-bot"
          git config user.email "els-bot@users.noreply.github.com"
          git add data/ docs/data/
          if git diff --staged --quiet; then
            echo "No changes (market holiday?)"
          else
            git commit -m "chore: ELS report $(date -u +%Y-%m-%d)"
            git push
          fi
